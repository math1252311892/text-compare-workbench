<script id="diffEngine">
/* 基于原版 Levenshtein 工作流升级。核心为纯函数；同一份代码在 Worker 与测试中运行。 */
function createDiffEngine() {
  'use strict';
  const HAS_SEGMENTER = typeof Intl !== 'undefined' && typeof Intl.Segmenter === 'function';
  const graphemeSegmenter = HAS_SEGMENTER ? new Intl.Segmenter('zh', {granularity:'grapheme'}) : null;
  const wordSegmenter = HAS_SEGMENTER ? new Intl.Segmenter('zh', {granularity:'word'}) : null;
  const LIMIT = 1000000, EXACT_BUDGET = 24000000, DISPLAY_BUDGET = 12000000;
  function split(text) {
    const units=[], offsets=[0];
    // 降级使用完整 Unicode 码点（不拆代理对）；界面明确标识计数单位的变化。
    for (const v of graphemeSegmenter ? graphemeSegmenter.segment(text) : text) {
      const s=typeof v==='string'?v:v.segment; units.push(s); offsets.push(offsets[offsets.length-1]+s.length);
    }
    return {units,offsets};
  }
  function prepare(raw, opt) {
    const kept=[];
    for(let i=0;i<raw.units.length;i++) {
      let key=raw.units[i];
      if(opt.space && /^\s+$/u.test(key)) continue;
      if(opt.punctuation && /^\p{P}[\p{P}\p{M}\uFE0F]*$/u.test(key)) continue;
      if(opt.case) key=key.replace(/[A-Z]/g,c=>c.toLowerCase());
      kept.push({key,r:i});

    return kept;
  }
  function emit(ops,type,a0,a1,b0,b1,gid) {
    if(a0===a1 && b0===b1) return;
    const last=ops[ops.length-1];
    if(last && last.type===type && last.gid===gid && last.a1===a0 && last.b1===b0) {last.a1=a1;last.b1=b1;}
    else ops.push({type,a0,a1,b0,b1,gid});
  }
  // 两行数值 DP + 每格一字节方向；大问题仅使用带状区域。
  // 若带宽 w 内求得 D<=w，则任何更优路径也必在该带内，故结果严格精确。
  // 若未获得此证书，绝不把该次结果当作最短距离。
  function matrix(a,b,as,ae,bs,be,w,budget) {
    const m=ae-as,n=be-bs, full=w===null, width=full?n+1:2*w+1;
    const cells=(m+1)*width;
    if(cells>budget.left || cells>32000000) return null;
    budget.left-=cells;
    const dir=new Uint8Array(cells), INF=0x3fffffff;

    const index=(i,j)=>i*width+(full?j:j-i+w);
    for(let j=0;j<=Math.min(n,full?n:w);j++) {prev[j]=j;if(j)dir[index(0,j)]=3;}
    for(let i=1;i<=m;i++) {
      const lo=full?0:Math.max(0,i-w),hi=full?n:Math.min(n,i+w);
      if(lo>0)cur[lo-1]=INF;
      if(hi<n)cur[hi+1]=INF;
      if(lo===0){cur[0]=i;dir[index(i,0)]=2;}
      const ai=a[as+i-1].key;
      for(let j=Math.max(1,lo);j<=hi;j++) {
        const match=ai===b[bs+j-1].key;
        let val=prev[j-1]+(match?0:1),d=1;

        if(prev[j]+1<val){val=prev[j]+1;d=2;}
        if(cur[j-1]+1<val){val=cur[j-1]+1;d=3;}
        cur[j]=val;dir[index(i,j)]=d;
      }
      [prev,cur]=[cur,prev];
    }
    const distance=prev[n];
    if(!full && distance>w) return null;
    const rev=[];let i=m,j=n;
    while(i || j) {
      const d=dir[index(i,j)];
      if(d===1) {rev.push({type:a[as+i-1].key===b[bs+j-1].key?'equal':'replace',a0:as+i-1,a1:as+i,b0:bs+j-1,b1:bs+j});i--;j--;}
      else if(d===2){rev.push({type:'delete',a0:as+i-1,a1:as+i,b0:bs+j,b1:bs+j});i--;}
      else if(d===3){rev.push({type:'insert',a0:as+i,a1:as+i,b0:bs+j-1,b1:bs+j});j--;}
      else throw new Error('编辑路径校验失败');

    const ops=[];
    for(let k=rev.length-1;k>=0;k--){const p=rev[k];emit(ops,p.type,p.a0,p.a1,p.b0,p.b1);}
    return {distance,ops,method:full?'紧凑动态规划':'带状动态规划（已证明精确）'};
  }
  function exact(a,b,budget={left:EXACT_BUDGET}) {
    let s=0,ae=a.length,be=b.length;
    while(s<ae && s<be && a[s].key===b[s].key)s++;
    while(ae>s && be>s && a[ae-1].key===b[be-1].key){ae--;be--;}
    const ops=[];emit(ops,'equal',0,s,0,s);
    let middle, m=ae-s,n=be-s;
    if(!m || !n) {middle={distance:m+n,ops:[],method:'共同前后缀与空序列精确求解'};emit(middle.ops,m?'delete':'insert',s,ae,s,be);}
    else if(m+n>4000 && (()=>{const keys=new Set();for(let i=s;i<ae;i++)keys.add(a[i].key);for(let j=s;j<be;j++)if(keys.has(b[j].key))return false;return true;})()) {
      // 没有任何可匹配单元时，max(m,n) 是可达到的严格下界，直接构造最短路径。
      const k=Math.min(m,n);middle={distance:Math.max(m,n),ops:[],method:'无公共字符的精确下界'};
      emit(middle.ops,'replace',s,s+k,s,s+k);emit(middle.ops,'delete',s+k,ae,s+k,s+k);emit(middle.ops,'insert',ae,ae,s+k,be);
    }
    else if((m+1)*(n+1)<=4000000) middle=matrix(a,b,s,ae,s,be,null,budget);
    else {
      for(const w of [...new Set([Math.max(32,Math.abs(m-n)),Math.max(128,Math.abs(m-n)),Math.max(512,Math.abs(m-n)),Math.max(1024,Math.abs(m-n))])]) {
        if(w>=Math.max(m,n)) break;
        middle=matrix(a,b,s,ae,s,be,w,budget);if(middle)break;
        if(budget.left<(m+1)*65)break;

      if(!middle && (m+1)*(n+1)<=budget.left)middle=matrix(a,b,s,ae,s,be,null,budget);
    }
    if(!middle)return null;
    for(const p of middle.ops)emit(ops,p.type,p.a0,p.a1,p.b0,p.b1);
    emit(ops,'equal',ae,a.length,be,b.length);
    return {distance:middle.distance,ops,method:middle.method};
  }
  // 按归一化后的序列分层：忽略规则不会改写输入，所有结果仍映射回原始字素。
  function tokenize(chars,mode) {
    if(mode==='char')return chars.map((c,i)=>({key:c.key,start:i,end:i+1}));
    const text=chars.map(c=>c.key).join(''), parts=[];
    if(mode==='word' && wordSegmenter) for(const p of wordSegmenter.segment(text)) parts.push(p.segment);
    else {
      const re=mode==='word'?/[\p{L}\p{N}_]+|\s+|[^\p{L}\p{N}_\s]/gu:mode==='sentence'?/[^。！？!?；;\n\r.]+(?:[。！？!?；;.]+[”’」』）)\]"']*|\r?\n|\r|$)|[。！？!?；;.]+[”’」』）)\]"']*|\r?\n|\r/gu:/[^\r\n]*(?:\r\n|\r|\n)|[^\r\n]+$/gu;
      for(const m of text.matchAll(re)) parts.push(m[0]);
    }
    // 分词边界若落在组合字素中，合并到下一个完整字素，禁止截断 Unicode 单元。
    const tokens=[];let idx=0,pos=0,endPos=0,start=0;
    for(const part of parts){endPos+=part.length;while(idx<chars.length && pos<endPos){pos+=chars[idx].key.length;idx++;}if(idx>start){tokens.push({key:chars.slice(start,idx).map(c=>c.key).join(''),start,end:idx});start=idx;}}
    if(start<chars.length)tokens.push({key:chars.slice(start).map(c=>c.key).join(''),start,end:chars.length});
    return tokens;
  }
  // 稀有文本锚点 + 最长递增子序列。仅用于阅读对齐，不宣称全局最短。
  function anchored(a,b,budget,depth=0) {
    const e=exact(a,b,budget);if(e)return e.ops;
    let s=0,ae=a.length,be=b.length;while(s<ae&&s<be&&a[s].key===b[s].key)s++;
    while(ae>s&&be>s&&a[ae-1].key===b[be-1].key){ae--;be--;}
    const out=[];emit(out,'equal',0,s,0,s);
    const ma=new Map(),mb=new Map();
    for(let i=s;i<ae;i++)ma.set(a[i].key,ma.has(a[i].key)?-1:i);
    for(let j=s;j<be;j++)mb.set(b[j].key,mb.has(b[j].key)?-1:j);
    const pairs=[];for(const [key,i]of ma){const j=mb.get(key);if(i>=0&&j>=0)pairs.push([i,j]);}pairs.sort((x,y)=>x[0]-y[0]);
    const tails=[],tailIds=[],prev=new Int32Array(pairs.length).fill(-1);
    for(let k=0;k<pairs.length;k++){const j=pairs[k][1];let l=0,r=tails.length;while(l<r){const mid=(l+r)>>1;if(tails[mid]<j)l=mid+1;else r=mid;}if(l)prev[k]=tailIds[l-1];tails[l]=j;tailIds[l]=k;}
    const anchors=[];if(tailIds.length){let k=tailIds[tailIds.length-1];while(k>=0){anchors.push(pairs[k]);k=prev[k];}anchors.reverse();}
    let ai=s,bi=s;
    const gap=(x,y)=>{
      if(ai<x||bi<y){let sub=null;if(depth<5&&budget.left>0)sub=exact(a.slice(ai,x),b.slice(bi,y),budget);
        if(sub)for(const p of sub.ops)emit(out,p.type,ai+p.a0,ai+p.a1,bi+p.b0,bi+p.b1);
        else {emit(out,'delete',ai,x,bi,bi);emit(out,'insert',x,x,bi,y);}}
    };
    for(const [x,y]of anchors){gap(x,y);emit(out,'equal',x,x+1,y,y+1);ai=x+1;bi=y+1;}
    gap(ae,be);emit(out,'equal',ae,a.length,be,b.length);return out;
  }
  function mergeChanges(ops) {
    const out=[];
    for(const p of ops){const type=p.type==='equal'?'equal':'change';emit(out,type,p.a0,p.a1,p.b0,p.b1);}
    return out;
  }
  function alignLevel(a,b,mode,budget) {
    const at=tokenize(a,mode),bt=tokenize(b,mode),tOps=anchored(at,bt,budget);
    const bound=(t,i,len)=>i<t.length?t[i].start:len;
    return mergeChanges(tOps).map(p=>({type:p.type,a0:bound(at,p.a0,a.length),a1:bound(at,p.a1,a.length),b0:bound(bt,p.b0,b.length),b1:bound(bt,p.b1,b.length)}));
  }
  function refine(a,b,mode,budget) {
    const e=exact(a,b,budget);if(e)return e.ops;
    if(mode==='char') {const out=[];emit(out,'delete',0,a.length,0,0);emit(out,'insert',a.length,a.length,0,b.length);return out;}
    const next=mode==='paragraph'?'sentence':mode==='sentence'?'word':'char';
    const chunks=alignLevel(a,b,next,budget),out=[];
    for(const c of chunks){if(c.type==='equal')emit(out,'equal',c.a0,c.a1,c.b0,c.b1);else for(const p of refine(a.slice(c.a0,c.a1),b.slice(c.b0,c.b1),next,budget))emit(out,p.type,c.a0+p.a0,c.a0+p.a1,c.b0+p.b0,c.b0+p.b1);}
    return out;
  }
  function rawOperations(normOps,a,b,ra,rb) {
    const out=[];let ca=0,cb=0;
    function put(type,ea,eb,gid){emit(out,type,ca,ea,cb,eb,gid);ca=ea;cb=eb;}
    function rawText(r,l,h){return r.units.slice(l,h).join('');}
    for(const p of normOps){let i=p.a0,j=p.b0;
      while(i<p.a1||j<p.b1){const ia=i<p.a1?a[i].r:(i<a.length?a[i].r:ra.units.length),jb=j<p.b1?b[j].r:(j<b.length?b[j].r:rb.units.length);
        if(ca<ia||cb<jb)put(rawText(ra,ca,ia)===rawText(rb,cb,jb)?'equal':'ignored',ia,jb,p.gid);
        if(p.type==='delete'){put('delete',a[i].r+1,cb,p.gid);i++;}
        else if(p.type==='insert'){put('insert',ca,b[j].r+1,p.gid);j++;}
        else {put(p.type==='equal'?(ra.units[a[i].r]===rb.units[b[j].r]?'equal':'ignored'):'replace',a[i].r+1,b[j].r+1,p.gid);i++;j++;}
      }
    }
    if(ca<ra.units.length||cb<rb.units.length)put(rawText(ra,ca,ra.units.length)===rawText(rb,cb,rb.units.length)?'equal':'ignored',ra.units.length,rb.units.length,-1);
    return out;
  }
  function validate(ops,a,b,normalized=true) {
    let i=0,j=0,cost=0;const stats={same:0,insert:0,delete:0,replace:0};
    for(const p of ops){if(p.a0!==i||p.b0!==j||p.a1<i||p.b1<j)throw new Error('操作范围不连续');
      const x=p.a1-i,y=p.b1-j;
      if(p.type==='equal'){if(x!==y)throw new Error('匹配长度错误');for(let k=0;k<x;k++)if(a[i+k].key!==b[j+k].key)throw new Error('匹配内容错误');stats.same+=x;}
      else if(p.type==='replace'){if(x!==y)throw new Error('替换长度错误');stats.replace+=x;cost+=x;}
      else if(p.type==='delete'){if(y!==0)throw new Error('删除范围错误');stats.delete+=x;cost+=x;}
      else if(p.type==='insert'){if(x!==0)throw new Error('新增范围错误');stats.insert+=y;cost+=y;}

  }
  function compare(original,target,options={},progress=()=>{}) {
    if(original.length+target.length>LIMIT)throw new Error('两段文本合计超过 100 万 UTF-16 单元，请按章节分批比较。');

    let mode=options.mode||'auto';if(mode==='auto')mode=Math.max(ra.units.length,rb.units.length)>900&&(original.match(/\n/g)||[]).length+(target.match(/\n/g)||[]).length>=4?'paragraph':Math.max(a.length,b.length)>450?'sentence':'word';
    progress('正在进行'+({char:'字符',word:'词语',sentence:'句子',paragraph:'段落'}[mode])+'对齐…');
    const budget={left:DISPLAY_BUDGET};let top,normOps=[];
    if((mode==='char'&&e) || (e&&e.distance===0)) {
      top=mergeChanges(e.ops);
      let k=0;for(const p of e.ops){while(k<top.length-1 && (p.a0>=top[k].a1&&p.b0>=top[k].b1))k++;normOps.push({...p,gid:k});}
    } else {
      const layoutMode=mode==='char'?'paragraph':mode;
      top=alignLevel(a,b,layoutMode,budget);
      top.forEach((c,gid)=>{if(c.type==='equal')normOps.push({...c,gid});else {const parts=refine(a.slice(c.a0,c.a1),b.slice(c.b0,c.b1),layoutMode,budget);for(const p of parts)normOps.push({...p,a0:c.a0+p.a0,a1:c.a0+p.a1,b0:c.b0+p.b0,b1:c.b0+p.b1,gid});}});
    }
    // 粗粒度只提供对齐上下文。较长的真实匹配或句末/换行是区域边界，
